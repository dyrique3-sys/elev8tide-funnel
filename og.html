<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
.card{width:1200px;height:630px;position:relative;overflow:hidden;font-family:'Jost',sans-serif;
  background:linear-gradient(90deg,rgba(14,28,31,.96) 0%,rgba(16,40,44,.78) 48%,rgba(16,40,44,.20) 100%),
  url('img/hero_face.jpg') right 22%/cover}
.wrap{position:absolute;left:84px;top:50%;transform:translateY(-50%);color:#F4EFE6;max-width:620px}
.e8{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:84px;line-height:.8;color:#F4EFE6}
.e8 b{color:#C8A06A;font-weight:600}
.wm{font-family:'Cormorant Garamond',serif;font-size:58px;letter-spacing:14px;color:#F4EFE6;margin-top:18px}
.rule{width:90px;height:2px;background:#C8A06A;margin:26px 0}
.tag{font-size:19px;letter-spacing:6px;color:#C8A06A;text-transform:uppercase}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:#cdd8d5;margin-top:26px}
.disc{position:absolute;bottom:34px;left:84px;font-size:12px;letter-spacing:2px;color:#7f928f;text-transform:uppercase}
</style></head>
<body>
<div class="card">
  <div class="wrap">
    <div class="e8">E<b>8</b></div>
    <div class="wm">ELEV8TIDE</div>
    <div class="rule"></div>
    <div class="tag">Elevate Wellness · Restore Confidence</div>
    <div class="sub">Find your way back to you.</div>
  </div>
  <div class="disc">A Private Consultation · For Research Use Only · 21+</div>
</div>
</body></html>
